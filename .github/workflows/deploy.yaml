name: Deploy

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.deluge_version || 'default' }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      deluge_version:
        description: 'Stable Deluge version'
        required: false
        type: string
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
  # GitHub cannot subscribe directly to releases in another repository.
  # Poll PyPI daily and build the latest stable upstream source tag.
  schedule:
    - cron: '33 3 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, test, and publish Docker image
    runs-on: ubuntu-latest
    outputs:
      deluge_version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Resolve Deluge release
        id: release
        env:
          DELUGE_VERSION: ${{ inputs.deluge_version }}
        run: python3 scripts/resolve_deluge_version.py
      - name: Set image name and tags
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DELUGE_VERSION: ${{ steps.release.outputs.version }}
          IS_LATEST: ${{ steps.release.outputs.is_latest }}
          REQUESTED_VERSION: ${{ inputs.deluge_version }}
        run: |
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          image="ghcr.io/${owner,,}/${name#docker-}"
          image="${image,,}"
          branch_tag="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')"
          {
            echo 'IMAGE_TAGS<<EOF'
            echo "${image}:${DELUGE_VERSION}-${GITHUB_SHA:0:8}"
            echo "${image}:${GITHUB_SHA:0:8}"
            # Historical manual builds must not replace current branch aliases.
            if [[ -z "$REQUESTED_VERSION" ]]; then
              echo "${image}:${branch_tag}"
            fi
            if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then
              echo "${image}:${DELUGE_VERSION}"
              if [[ "$IS_LATEST" == true ]]; then
                echo "${image}:latest"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build runtime test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: deluge:smoke
          build-args: |
            DELUGE_BRANCH=deluge-${{ steps.release.outputs.version }}
      - name: Test container runtime before publishing
        run: bash scripts/smoke_test.sh deluge:smoke
      - name: Scan image before publishing
        run: bash scripts/scan_image.sh deluge:smoke
      - name: Login into GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DELUGE_BRANCH=deluge-${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE_TAGS }}

  sync-version:
    name: Sync published Deluge version
    needs: build
    if: github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout built revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Update Dockerfile pin
        env:
          DELUGE_VERSION: ${{ needs.build.outputs.deluge_version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo 'Branch changed during build; leaving Dockerfile for next scheduled run.'
            exit 0
          fi
          python3 scripts/resolve_deluge_version.py --pin "$DELUGE_VERSION"
          if git diff --quiet -- Dockerfile; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "build: pin Deluge to published release $DELUGE_VERSION"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
